name: サイトを公開（パスワード付き）

on:
  push:
    branches: [main]           # ファイルをアップロード（Commit）するたびに自動で公開し直す
  workflow_dispatch:           # 手動実行用

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: パスワード付きの公開用ファイルを作る
        env:
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
        run: |
          if [ -z "$PAGE_PASSWORD" ]; then echo "PAGE_PASSWORD が未設定です。パスワードなしでは公開しません。"; exit 1; fi
          mkdir -p _site
          npx -y staticrypt@3 index.html -p "$PAGE_PASSWORD" -d _site --short \
            --template-title "浸水予測AIイメージ（関係者限り）" \
            --template-instructions "関係者に共有されたパスワードを入力してください" \
            --template-button "開く"
          cp -r data _site/data
          cp robots.txt _site/robots.txt
          touch _site/.nojekyll
          test -f _site/index.html
           ls -laR _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
